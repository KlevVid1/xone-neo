name: Feature Request
description: Suggest an idea or enhancement for xone-neo
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or enhancement for xone-neo? Let us know!
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: What feature or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Motivation & Use Cases
      description: Why would this be useful? Which games or scenarios benefit from it?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
    validations:
      required: false
